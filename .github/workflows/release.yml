# タグ（v0.1.0 など）を push すると、Mac 版と Windows 版を作り、下書きのリリースに載せる
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'ひだまり村 v__VERSION__'
          releaseBody: |
            ダウンロードしたら、下の「はじめかた」を見てください。
            - Mac（Apple シリコン：M1〜）… `aarch64.dmg`
            - Mac（Intel）… `x64.dmg`
            - Windows … `x64-setup.exe`
          releaseDraft: true
          # 自動アップデートは使っていないので、そのためのファイルは載せない
          uploadUpdaterJson: false
          prerelease: false
          args: ${{ matrix.args }}
          # アプリ名が日本語だと GitHub 上のファイル名から消えてしまうので、英字の名前をつける
          assetNamePattern: 'hidamari-village_[version]_[arch][setup][ext]'
